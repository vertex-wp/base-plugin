name: Sync Vertex

on:
  schedule:
    # 09:00 Asia/Tehran (UTC+03:30). GitHub scheduled workflows use UTC.
    - cron: "30 5 * * *"
  workflow_dispatch:
  # Bootstrap vertex/ after this workflow is added.
  push:
    paths:
      - ".github/workflows/sync-vertex.yml"

permissions:
  contents: write

# Serialise workflows that commit generated files to main.
concurrency:
  group: base-plugin-main-writes
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Vertex main into vertex/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add or update Vertex subtree
        shell: bash
        run: |
          set -euo pipefail

          FRAMEWORK_REPOSITORY="https://github.com/vertex-wp/framework.git"

          if [ -d "vertex" ]; then
            git subtree pull --prefix=vertex "$FRAMEWORK_REPOSITORY" main --squash
          else
            git subtree add --prefix=vertex "$FRAMEWORK_REPOSITORY" main --squash
          fi

      - name: Push sync commit to main
        run: git push origin HEAD:main
