name: Build translation files

on:
  push:
    branches:
      - main
    paths:
      - 'index.php'
      - 'src/**/*.php'
      - 'languages/*.po'
      - '.github/workflows/translations.yml'
  workflow_dispatch:

permissions:
  contents: write

# Serialise workflows that commit generated files to main.
concurrency:
  group: base-plugin-main-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Install WP-CLI
        run: |
          curl -fsSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php wp-cli.phar --info

      - name: Generate POT from product PHP source
        run: php wp-cli.phar i18n make-pot . languages/ephpicman-plugin.pot --domain=ephpicman-plugin --exclude=vertex

      - name: Update existing PO catalogs without discarding translations
        run: |
          if [ -f languages/ephpicman-plugin-fa_IR.po ]; then
            php wp-cli.phar i18n update-po languages/ephpicman-plugin.pot languages/ephpicman-plugin-fa_IR.po
          fi

      - name: Compile MO files
        run: php wp-cli.phar i18n make-mo languages

      - name: Commit generated translation files
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- languages)" ]]; then
            echo "Translation files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages/*.pot languages/*.po languages/*.mo
          git commit -m "chore(i18n): regenerate translation files [skip ci]"

          # Rebase generated files onto the latest main before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
