name: PHP Lint

# Run syntax checks against both product code and the synchronised Vertex framework.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax (PHP ${{ matrix.php-version }}${{ matrix.experimental && ' (experimental)' || '' }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
        include:
          - php-version: '8.6'
            experimental: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: none
      - name: Lint plugin PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l
